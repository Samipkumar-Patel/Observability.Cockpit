replicaCount: 1

image:
  repository: ghcr.io/samipkumar-patel/cloudops-cockpit
  pullPolicy: IfNotPresent
  tag: "latest"

monitoringNamespace: "monitoring"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: "azure/application-gateway"
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
  host: radar.internal.cloudapp.azure.com
  path: /
  pathType: Prefix

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
